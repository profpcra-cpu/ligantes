<!DOCTYPE html>
<html lang="pt" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Brain Curves — IQ Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root {
    --bg-gradient-1: #e0e7ff;
    --bg-gradient-2: #f8fafc;
    --card-bg: #ffffff;
    --card-border: rgba(15, 23, 42, 0.08);
    --text-color: #0f172a;
    --text-muted: #64748b;
    --btn-primary: #6366f1;
    --c-blue: #38bdf8;
    --c-green: #4ade80;
    --c-red: #ef4444;
}

*, *::before, *::after { box-sizing: border-box; }
body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: radial-gradient(circle at 20% 0%, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 55%);
    background-attachment: fixed;
    color: var(--text-color);
    margin: 0;
    padding: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    touch-action: manipulation;
}

.container {
    background: var(--card-bg);
    padding: 24px;
    border-radius: 36px;
    box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.15);
    width: 100%;
    max-width: 440px;
    text-align: center;
    border: 1px solid var(--card-border);
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
}

.iq-badge {
    font-size: 22px;
    font-weight: 800;
    color: var(--text-color);
    letter-spacing: -0.5px;
    margin-bottom: 12px;
}

.board-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #ffffff;
    border-radius: 28px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06), inset 0 0 0 1px rgba(0, 0, 0, 0.04);
    overflow: hidden;
    margin-bottom: 16px;
    cursor: crosshair;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

.controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

button, select {
    width: 100%;
    padding: 12px;
    border-radius: 16px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: transform 0.1s ease;
}
button:active { transform: scale(0.98); }
.btn-action { background: var(--btn-primary); color: #fff; }
.btn-secondary { background: #f1f5f9; color: var(--text-muted); }
select { background: #f1f5f9; color: var(--text-color); font-weight: 700; text-align: center; appearance: none; }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <a href="#" style="text-decoration:none; color:var(--text-muted); font-weight:700; font-size:14px;">⬅ Voltar</a>
        <span id="display-pontos" style="font-weight:800; color:var(--btn-primary);">Pontos: 0</span>
    </div>

    <div class="iq-badge" id="iq-display">IQ = 94</div>

    <div class="board-wrapper">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>

    <div class="controls">
        <select id="select-nivel">
            <option value="1">Nível 1 (Básico)</option>
            <option value="2">Nível 2 (Intermédio)</option>
            <option value="3">Nível 3 (Avançado)</option>
        </select>
        <button class="btn-action" id="btn-reset">🔄 Reiniciar</button>
    </div>
</div>

<script type="module">
import { db } from "./firebase-config.js";
import { ref, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const estado = {
    nivel: 1,
    pares: [
        { id: 0, cor: '#4ade80', a: { x: 60, y: 60 }, b: { x: 340, y: 340 } },
        { id: 1, cor: '#ef4444', a: { x: 340, y: 60 }, b: { x: 60, y: 340 } }
    ],
    trilhas: {},
    desenhando: null,
    pontos: 0,
    jogadorSessao: JSON.parse(localStorage.getItem('brain_hub_jogador')) || { chave: 'visitante_default' }
};

function desenharTabuleiro() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Desenhar trilhas ativas com curvas suaves (Bézier)
    for (const parId in estado.trilhas) {
        const trilha = estado.trilhas[parId];
        if (trilha.length < 2) continue;
        
        ctx.beginPath();
        ctx.strokeStyle = trilha.cor;
        ctx.lineWidth = 14;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.moveTo(trilha[0].x, trilha[0].y);
        for (let i = 1; i < trilha.length; i++) {
            ctx.lineTo(trilha[i].x, trilha[i].y);
        }
        ctx.stroke();
    }

    // Desenhar linha em tempo real ao arrastar
    if (estado.desenhando && estado.desenhando.pontos.length > 1) {
        const d = estado.desenhando;
        ctx.beginPath();
        ctx.strokeStyle = d.cor;
        ctx.lineWidth = 14;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.moveTo(d.pontos[0].x, d.pontos[0].y);
        for (let i = 1; i < d.pontos.length; i++) {
            ctx.lineTo(d.pontos[i].x, d.pontos[i].y);
        }
        ctx.stroke();
    }

    // Desenhar as esferas (Endpoints) com efeito 3D e sombra realista
    estado.pares.forEach(par => {
        [par.a, par.b].forEach(p => {
            ctx.save();
            ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
            ctx.shadowBlur = 12;
            ctx.shadowOffsetY = 6;

            ctx.beginPath();
            ctx.arc(p.x, p.y, 22, 0, Math.PI * 2);
            ctx.fillStyle = par.cor;
            ctx.fill();

            // Brilho interior (estilo esfera 3D da imagem)
            ctx.beginPath();
            ctx.arc(p.x - 6, p.y - 6, 6, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.fill();

            ctx.restore();
        });
    });
}

// Controlo de toque e rato no Canvas
let ativo = false;
let parAtual = null;

canvas.addEventListener('pointerdown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (canvas.width / rect.width);
    const y = (e.clientY - rect.top) * (canvas.height / rect.height);

    estado.pares.forEach(par => {
        [ {p: par.a, tipo: 'a'}, {p: par.b, tipo: 'b'} ].forEach(item => {
            if (Math.hypot(item.p.x - x, item.p.y - y) < 28) {
                ativo = true;
                parAtual = par;
                delete estado.trilhas[par.id];
                estado.desenhando = { parId: par.id, cor: par.cor, pontos: [{ x: item.p.x, y: item.p.y }] };
            }
        });
    });
});

canvas.addEventListener('pointermove', (e) => {
    if (!ativo || !estado.desenhando) return;
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (canvas.width / rect.width);
    const y = (e.clientY - rect.top) * (canvas.height / rect.height);

    estado.desenhando.pontos.push({ x, y });
    desenharTabuleiro();
});

canvas.addEventListener('pointerup', (e) => {
    if (!ativo || !estado.desenhando) return;
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (canvas.width / rect.width);
    const y = (e.clientY - rect.top) * (canvas.height / rect.height);

    // Verificar se chegou ao ponto final correspondente
    const par = estado.pares.find(p => p.id === estado.desenhando.parId);
    const outroPonto = (Math.hypot(par.a.x - estado.desenhando.pontos[0].x, par.a.y - estado.desenhando.pontos[0].y) < 20) ? par.b : par.a;

    if (Math.hypot(outroPonto.x - x, outroPonto.y - y) < 30) {
        estado.trilhas[par.id] = [...estado.desenhando.pontos];
        verificarVitoria();
    }

    ativo = false;
    estado.desenhando = null;
    desenharTabuleiro();
});

function verificarVitoria() {
    if (Object.keys(estado.trilhas).length === estado.pares.length) {
        document.getElementById('iq-display').textContent = "IQ = 145 🎉";
        estado.pontos += 150;
        document.getElementById('display-pontos').textContent = `Pontos: ${estado.pontos}`;
        salvarNoFirebase();
    }
}

async function salvarNoFirebase() {
    try {
        const refUser = ref(db, 'jogadores/' + estado.jogadorSessao.chave);
        await update(refUser, { pontos: estado.pontos, ultimaAtividade: new Date().toISOString() });
    } catch (_) {}
}

document.getElementById('btn-reset').addEventListener('click', () => {
    estado.trilhas = {};
    document.getElementById('iq-display').textContent = "IQ = 94";
    desenharTabuleiro();
});

desenharTabuleiro();
</script>
</body>
</html>
