<!DOCTYPE html>
<html lang="pt-PT" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Brain Curves — Brain Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg-color: #0b1020; --bg-gradient-1: #1e1b4b; --bg-gradient-2: #0b1020;
    --card-bg: rgba(30, 41, 59, 0.72); --card-border: rgba(148, 163, 184, 0.15);
    --text-color: #f8fafc; --text-muted: #94a3b8; --border-color: rgba(148, 163, 184, 0.18);
    --input-bg: rgba(15, 23, 42, 0.7); --btn-primary: #6366f1; --btn-accent: #8b5cf6;
    --c-green: #4ade80; --c-blue: #38bdf8; --c-amber: #f59e0b; --c-star: #fbbf24;
    --board-bg: rgba(15, 23, 42, 0.55); --cell-empty: rgba(30, 41, 59, 0.55);
}
[data-theme="light"] {
    --bg-color: #eef2ff; --bg-gradient-1: #e0e7ff; --bg-gradient-2: #f8fafc;
    --card-bg: rgba(255, 255, 255, 0.9); --card-border: rgba(15, 23, 42, 0.08);
    --text-color: #0f172a; --text-muted: #475569; --border-color: rgba(15, 23, 42, 0.1);
    --input-bg: rgba(255, 255, 255, 0.95); --board-bg: rgba(248, 250, 252, 0.95);
    --cell-empty: rgba(226, 232, 240, 0.7);
}
*, *::before, *::after { box-sizing: border-box; }
body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: radial-gradient(circle at 20% 0%, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 55%);
    background-attachment: fixed; color: var(--text-color); margin: 0; padding: 12px;
    display: flex; justify-content: center; align-items: center; min-height: 100vh;
    touch-action: manipulation;
}
.container {
    background: var(--card-bg); backdrop-filter: blur(18px); padding: 16px;
    border-radius: 20px; width: 100%; max-width: 560px; text-align: center;
    border: 1px solid var(--card-border); box-shadow: 0 20px 60px -20px rgba(0,0,0,0.65);
}
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.btn-small { padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-muted); cursor: pointer; text-decoration: none; }
.user-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; background: var(--input-bg); padding: 8px 12px; border-radius: 12px; border: 1px solid var(--border-color); }
.score-board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; background: var(--input-bg); padding: 8px; border-radius: 12px; margin-bottom: 10px; font-size: 9px; border: 1px solid var(--border-color); color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
.score-board strong { font-size: 13px; font-family: 'JetBrains Mono', monospace; text-transform: none; }
#display-nivel { color: var(--c-blue); } #display-pontos { color: var(--c-green); } #display-tempo { color: #60a5fa; } #display-pares { color: var(--c-amber); } #display-estrelas { color: var(--c-star); }
.instructions { font-size: 11.5px; color: var(--text-muted); margin: 2px 0 10px; min-height: 28px; }

/* Tabuleiro 16x16 adaptado para ocupar o espaço ideal */
.board-wrapper { position: relative; width: 100%; aspect-ratio: 1 / 1; max-height: 480px; margin: 0 auto 10px; border-radius: 12px; overflow: hidden; background: var(--board-bg); border: 2px solid rgba(99, 102, 241, 0.35); touch-action: none; user-select: none; -webkit-user-select: none; }
#game-board { position: absolute; inset: 0; display: grid; gap: 1px; padding: 4px; }
.cell { background: var(--cell-empty); border-radius: 2px; position: relative; cursor: pointer; display: flex; align-items: center; justify-content: center; touch-action: none; }

/* Esferas adaptadas para o grid 16x16 */
.endpoint { width: 85%; height: 85%; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 3; pointer-events: none; box-shadow: inset -1px -1px 2px rgba(0,0,0,0.35), 0 2px 4px rgba(0,0,0,0.35); }
.endpoint.connected { box-shadow: inset -1px -1px 2px rgba(0,0,0,0.35), 0 0 0 2px rgba(255,255,255,0.7), 0 0 10px rgba(255,255,255,0.8); }

/* Linha centralizada para o rastro */
.cell.trail::before {
    content: "";
    position: absolute;
    inset: 25%;
    background: var(--trail-color, transparent);
    border-radius: 1px;
    z-index: 2;
}

.controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
select, button.action { width: 100%; padding: 10px; border-radius: 10px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color); }
button.action { border: none; background: linear-gradient(135deg, var(--btn-primary), var(--btn-accent)); color: #fff; }
button.secondary { background: linear-gradient(135deg, #475569, #334155); }
</style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <a href="#" class="btn-small">⬅ Voltar</a>
        <button id="theme-toggle" class="btn-small">🌙 Tema</button>
    </div>

    <div class="user-header">
        <div style="display:flex; align-items:center; gap:8px;">
            <span id="display-avatar" style="font-size:18px;">🎮</span>
            <strong id="display-nome" style="font-size:13px;">Jogador</strong>
        </div>
        <span style="font-size:11px; color:var(--text-muted);">Brain Curves (16x16)</span>
    </div>

    <div class="score-board">
        <div>Nível<br><strong id="display-nivel">1</strong></div>
        <div>Pontos<br><strong id="display-pontos">0</strong></div>
        <div>Tempo<br><strong id="display-tempo">00:00</strong></div>
        <div>Pares<br><strong id="display-pares">0/0</strong></div>
        <div>⭐<br><strong id="display-estrelas">0</strong></div>
    </div>

    <p class="instructions" id="info-instrucao">Arraste para ligar os pares no tabuleiro 16x16.</p>

    <div class="board-wrapper" id="board-wrapper">
        <div id="game-board"></div>
    </div>

    <div class="controls-grid">
        <select id="select-nivel">
            <option value="1" selected>Dificuldade 1</option>
            <option value="2">Dificuldade 2</option>
            <option value="3">Dificuldade 3</option>
        </select>
        <button id="btn-reset" class="action secondary">🔄 Reiniciar</button>
    </div>
</div>

<script type="module">
import { estado, iniciarPuzzle, atualizarVisualDom, lidarComMovimento, limparTrilha } from "./game-engine.js";

document.getElementById('display-nome').textContent = estado.jogadorSessao.nome;
document.getElementById('display-avatar').textContent = estado.jogadorSessao.avatar;

const board = document.getElementById('game-board');
const displayTempo = document.getElementById('display-tempo');
const displayPares = document.getElementById('display-pares');
const infoInstrucao = document.getElementById('info-instrucao');
const selectNivel = document.getElementById('select-nivel');
const btnReset = document.getElementById('btn-reset');
const themeToggle = document.getElementById('theme-toggle');

const callbacks = {
    onAtualizarVisual: () => {
        atualizarVisualDom();
        displayPares.textContent = `${Object.keys(estado.trilhas).length}/${estado.pares.length}`;
    },
    onAtualizarTempo: (tempoStr) => { displayTempo.textContent = tempoStr; },
    onVitoria: () => { infoInstrucao.innerHTML = "🎉 <b>Incrível! Puzzle 16x16 resolvido!</b>"; }
};

let activePointerId = null;

function obterCelulaPorCoordenadas(clientX, clientY) {
    const rect = board.getBoundingClientRect();
    if (clientX < rect.left || clientX > rect.right || clientY < rect.top || clientY > rect.bottom) {
        return null;
    }
    const n = estado.tamanho;
    const larguraCelula = rect.width / n;
    const alturaCelula = rect.height / n;
    
    const c = Math.floor((clientX - rect.left) / larguraCelula);
    const r = Math.floor((clientY - rect.top) / alturaCelula);
    
    if (r >= 0 && r < n && c >= 0 && c < n) {
        return { r, c };
    }
    return null;
}

board.addEventListener('pointerdown', (e) => {
    if (estado.concluido) return;
    const cell = e.target.closest('.cell');
    if (!cell) return;
    const r = parseInt(cell.dataset.r), c = parseInt(cell.dataset.c);
    const dado = estado.grid[r][c];

    if (dado.tipo === 'endpoint') {
        e.preventDefault();
        activePointerId = e.pointerId;
        try { board.setPointerCapture(e.pointerId); } catch (_) {}

        if (estado.trilhas[dado.parId]) {
            limparTrilha(estado.trilhas[dado.parId]);
            delete estado.trilhas[dado.parId];
        }
        estado.desenhando = { parId: dado.parId, cor: dado.cor, pontos: [{ r, c }] };
        callbacks.onAtualizarVisual();
    }
});

board.addEventListener('pointermove', (e) => {
    if (!estado.desenhando || e.pointerId !== activePointerId) return;
    e.preventDefault();

    const coords = obterCelulaPorCoordenadas(e.clientX, e.clientY);
    if (!coords) return;

    lidarComMovimento(coords.r, coords.c, callbacks);
});

board.addEventListener('pointerup', (e) => {
    if (e.pointerId === activePointerId) {
        try { board.releasePointerCapture(e.pointerId); } catch (_) {}
        activePointerId = null;
        estado.desenhando = null;
        callbacks.onAtualizarVisual();
    }
});

board.addEventListener('pointercancel', (e) => {
    if (e.pointerId === activePointerId) {
        try { board.releasePointerCapture(e.pointerId); } catch (_) {}
        activePointerId = null;
        estado.desenhando = null;
        callbacks.onAtualizarVisual();
    }
});

selectNivel.addEventListener('change', (e) => iniciarPuzzle(parseInt(e.target.value), board, callbacks));
btnReset.addEventListener('click', () => iniciarPuzzle(estado.nivel, board, callbacks));

themeToggle.addEventListener('click', () => {
    const atual = document.documentElement.getAttribute('data-theme');
    const proximo = atual === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', proximo);
    themeToggle.textContent = proximo === 'dark' ? '🌙 Tema' : '☀️ Tema';
});

iniciarPuzzle(1, board, callbacks);
</script>
</body>
</html>
