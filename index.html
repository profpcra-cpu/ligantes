<!DOCTYPE html>
<html lang="pt-PT" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Brain Curves — IQ Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root {
    --bg-gradient-1: #e0e7ff;
    --bg-gradient-2: #f8fafc;
    --card-bg: #ffffff;
    --card-border: rgba(15, 23, 42, 0.08);
    --text-color: #0f172a;
    --text-muted: #64748b;
    --btn-primary: #6366f1;
}

*, *::before, *::after { box-sizing: border-box; }
body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: radial-gradient(circle at 20% 0%, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 55%);
    background-attachment: fixed;
    color: var(--text-color);
    margin: 0;
    padding: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    touch-action: manipulation;
}

.container {
    background: var(--card-bg);
    padding: 24px;
    border-radius: 36px;
    box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.15);
    width: 100%;
    max-width: 480px;
    text-align: center;
    border: 1px solid var(--card-border);
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
}

.iq-badge {
    font-size: 24px;
    font-weight: 800;
    color: var(--text-color);
    letter-spacing: -0.5px;
    margin-bottom: 12px;
}

.board-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #ffffff;
    border-radius: 28px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06), inset 0 0 0 1px rgba(0, 0, 0, 0.04);
    overflow: hidden;
    margin-bottom: 16px;
    cursor: crosshair;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

.controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

button, select {
    width: 100%;
    padding: 12px;
    border-radius: 16px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: transform 0.1s ease;
}
button:active { transform: scale(0.98); }
.btn-action { background: var(--btn-primary); color: #fff; }
select { background: #f1f5f9; color: var(--text-color); font-weight: 700; text-align: center; appearance: none; }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <a href="#" style="text-decoration:none; color:var(--text-muted); font-weight:700; font-size:14px;">⬅ Voltar</a>
        <span id="display-pontos" style="font-weight:800; color:var(--btn-primary);">Pontos: 0</span>
    </div>

    <div class="iq-badge" id="iq-display">IQ = 94</div>

    <div class="board-wrapper">
        <canvas id="gameCanvas" width="500" height="500"></canvas>
    </div>

    <div class="controls">
        <select id="select-nivel">
            <option value="1">Nível 1 (1 Par)</option>
            <option value="2">Nível 2 (2 Pares)</option>
            <option value="3">Nível 3 (3 Pares)</option>
            <option value="4">Nível 4 (4 Pares)</option>
            <option value="5" selected>Nível 5 (5 Pares)</option>
        </select>
        <button class="btn-action" id="btn-reset">🔄 Reiniciar</button>
    </div>
</div>

<script type="module">
import { db } from "./firebase-config.js";
import { ref, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const PALETA = ['#22c55e', '#3b82f6', '#ef4444', '#f59e0b', '#a855f7', '#06b6d4', '#ec4899', '#84cc16'];

const estado = {
    nivel: 5,
    pares: [],
    trilhas: {},
    desenhando: null,
    pontos: 0,
    jogadorSessao: JSON.parse(localStorage.getItem('brain_hub_jogador')) || { chave: 'visitante_default' }
};

function gerarPares(qtd) {
    const pares = [];
    const margem = 60;
    const tamanhoArea = canvas.width - (margem * 2);

    for (let i = 0; i < qtd; i++) {
        let a, b;
        let tentativas = 0;

        do {
            a = { x: margem + Math.random() * tamanhoArea, y: margem + Math.random() * tamanhoArea };
            b = { x: margem + Math.random() * tamanhoArea, y: margem + Math.random() * tamanhoArea };
            tentativas++;
        } while (Math.hypot(a.x - b.x, a.y - b.y) < 120 && tentativas < 100);

        pares.push({
            id: i,
            cor: PALETA[i % PALETA.length],
            a, b
        });
    }
    return pares;
}

function iniciarJogo(nivel) {
    estado.nivel = nivel;
    estado.pares = gerarPares(nivel);
    estado.trilhas = {};
    estado.desenhando = null;
    document.getElementById('iq-display').textContent = `IQ = ${90 + nivel * 10}`;
    desenharTabuleiro();
}

function desenharTabuleiro() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (const parId in estado.trilhas) {
        const trilha = estado.trilhas[parId];
        if (trilha.pontos.length < 2) continue;

        ctx.beginPath();
        ctx.strokeStyle = trilha.cor;
        ctx.lineWidth = 16;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.moveTo(trilha.pontos[0].x, trilha.pontos[0].y);
        for (let i = 1; i < trilha.pontos.length; i++) {
            ctx.lineTo(trilha.pontos[i].x, trilha.pontos[i].y);
        }
        ctx.stroke();
    }

    if (estado.desenhando && estado.desenhando.pontos.length > 1) {
        const d = estado.desenhando;
        ctx.beginPath();
        ctx.strokeStyle = d.cor;
        ctx.lineWidth = 16;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.moveTo(d.pontos[0].x, d.pontos[0].y);
        for (let i = 1; i < d.pontos.length; i++) {
            ctx.lineTo(d.pontos[i].x, d.pontos[i].y);
        }
        ctx.stroke();
    }

    estado.pares.forEach(par => {
        [par.a, par.b].forEach(p => {
            ctx.save();
            ctx.shadowColor = 'rgba(0, 0, 0, 0.25)';
            ctx.shadowBlur = 14;
            ctx.shadowOffsetY = 6;

            ctx.beginPath();
            ctx.arc(p.x, p.y, 24, 0, Math.PI * 2);
            ctx.fillStyle = par.cor;
            ctx.fill();

            ctx.beginPath();
            ctx.arc(p.x - 7, p.y - 7, 7, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
            ctx.fill();

            ctx.restore();
        });
    });
}

let activePointerId = null;

function obterCoordenadasCanvas(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
    };
}

canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const pos = obterCoordenadasCanvas(e);

    estado.pares.forEach(par => {
        [ {p: par.a}, {p: par.b} ].forEach(item => {
            if (Math.hypot(item.p.x - pos.x, item.p.y - pos.y) < 35) {
                activePointerId = e.pointerId;
                try { canvas.setPointerCapture(e.pointerId); } catch (_) {}

                delete estado.trilhas[par.id];
                estado.desenhando = { parId: par.id, cor: par.cor, pontos: [{ x: item.p.x, y: item.p.y }] };
            }
        });
    });
});

canvas.addEventListener('pointermove', (e) => {
    if (!estado.desenhando || e.pointerId !== activePointerId) return;
    e.preventDefault();
    const pos = obterCoordenadasCanvas(e);

    estado.desenhando.pontos.push({ x: pos.y ? pos.x : pos.x, y: pos.y });
    desenharTabuleiro();
});

canvas.addEventListener('pointerup', (e) => {
    if (e.pointerId !== activePointerId) return;
    try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}

    if (estado.desenhando) {
        const pos = obterCoordenadasCanvas(e);
        const par = estado.pares.find(p => p.id === estado.desenhando.parId);
        const inicioTrilha = estado.desenhando.pontos[0];
        const outroPonto = (Math.hypot(par.a.x - inicioTrilha.x, par.a.y - inicioTrilha.y) < 30) ? par.b : par.a;

        if (Math.hypot(outroPonto.x - pos.x, outroPonto.y - pos.y) < 40) {
            estado.trilhas[par.id] = { cor: par.cor, pontos: [...estado.desenhando.pontos] };
            verificarVitoria();
        }
    }

    activePointerId = null;
    estado.desenhando = null;
    desenharTabuleiro();
});

canvas.addEventListener('pointercancel', (e) => {
    if (e.pointerId === activePointerId) {
        try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
        activePointerId = null;
        estado.desenhando = null;
        desenharTabuleiro();
    }
});

function verificarVitoria() {
    if (Object.keys(estado.trilhas).length === estado.pares.length) {
        document.getElementById('iq-display').textContent = "IQ = 160 🎉";
        estado.pontos += estado.nivel * 50;
        document.getElementById('display-pontos').textContent = `Pontos: ${estado.pontos}`;
        salvarNoFirebase();
    }
}

async function salvarNoFirebase() {
    try {
        const refUser = ref(db, 'jogadores/' + estado.jogadorSessao.chave);
        await update(refUser, { pontos: estado.pontos, ultimaAtividade: new Date().toISOString() });
    } catch (_) {}
}

document.getElementById('select-nivel').addEventListener('change', (e) => {
    iniciarJogo(parseInt(e.target.value));
});

document.getElementById('btn-reset').addEventListener('click', () => {
    iniciarJogo(estado.nivel);
});

iniciarJogo(5);
</script>
</body>
</html>
